<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAFEARN - Hors Ligne</title>
<style>
  body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; color: #0f172a; }
  .container { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 350px; }
  .icon { font-size: 60px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 10px; color: #0284c7; }
  p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 25px; }
  button { background: #0ea5e9; color: white; border: none; padding: 12px 24px; border-radius: 50px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; transition: background 0.2s; }
  button:hover { background: #0284c7; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Oups, pas d'internet !</h1>
    <p>Tu es actuellement hors ligne. Vérifie ta connexion Wi-Fi ou tes données mobiles pour continuer à gagner de l'argent sur XAFEARN.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
